name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "tools/**", "firestore.rules", "storage.rules", "firestore.indexes.json"]

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (licencias)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Preparar la app (Capacitor)
        working-directory: movil
        run: |
          npm install --no-audit --no-fund
          node preparar.js
          npx cap add android
          node android-ajustes.js
          npx cap sync android

      - name: Compilar el APK
        working-directory: movil/android
        run: |
          mkdir -p ~/.android && cp ../mascotita.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nombrar el APK
        run: |
          cp movil/android/app/build/outputs/apk/debug/app-debug.apk Mascotita.apk
          ls -la Mascotita.apk

      - name: Guardar en Actions
        uses: actions/upload-artifact@v6
        with:
          name: Mascotita-APK-${{ github.run_number }}
          path: Mascotita.apk

      - name: Publicar en Releases (enlace fijo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Mascotita para Android
          body: |
            APK de Mascotita para celulares y tablets Android.
            Compilación #${{ github.run_number }} · ${{ github.sha }}
            Descargá **Mascotita.apk** y abrilo en el celular para instalar o actualizar.
          files: Mascotita.apk
          make_latest: true
